<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#667eea"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Daily Hub"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="icon" type="image/svg+xml" href="./icon.svg"/>
<link rel="apple-touch-icon" href="./icon.svg"/>
<title>Daily Hub · 每日中枢</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pri:#667eea;--pri2:#764ba2;--pril:#eef0fe;
  --g:#2d7d55;--gl:#e8f5ee;--gm:#4caf7d;
  --r:#d93025;--rl:#fdecea;
  --o:#e67e22;--ol:#fef3e2;
  --b:#1a73e8;--bl:#e8f0fe;
  --amber:#b7791f;--amberl:#fefcbf;
  --bg:#f2f4f8;--sur:#fff;--bdr:#dfe4ee;
  --tx:#1e2430;--txm:#6b7487;
  --sh:0 2px 8px rgba(30,36,48,.08);
  --rad:14px;--tabh:58px;--hdrh:52px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
.hidden{display:none!important}

/* ══ lock screen ══ */
#lock{position:fixed;inset:0;background:linear-gradient(150deg,#667eea,#764ba2 55%,#2d7d55 130%);z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
.lk-logo{font-size:54px;margin-bottom:10px}
.lk-title{color:#fff;font-size:22px;font-weight:700;margin-bottom:4px}
.lk-sub{color:rgba(255,255,255,.75);font-size:13px;margin-bottom:24px;text-align:center;line-height:1.6}
.lk-box{background:#fff;border-radius:16px;padding:22px 20px;width:100%;max-width:340px;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.lk-box.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#pin-inp{width:100%;padding:12px;border:2px solid var(--bdr);border-radius:10px;font-size:22px;text-align:center;letter-spacing:10px;outline:none;font-family:inherit}
#pin-inp:focus{border-color:var(--pri)}
.lk-err{color:var(--r);font-size:12.5px;text-align:center;margin-top:9px;min-height:17px}
.lk-btn{width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.lk-btn:disabled{opacity:.6}
.lk-adv{margin-top:14px;font-size:12px;color:var(--txm)}
.lk-adv summary{cursor:pointer;text-align:center}
.lk-adv input{width:100%;padding:8px 10px;border:1.5px solid var(--bdr);border-radius:8px;font-size:13px;margin-top:7px;font-family:inherit}
.lk-adv button{width:100%;margin-top:8px;padding:9px;border:none;border-radius:8px;background:var(--pril);color:var(--pri);font-weight:600;cursor:pointer;font-family:inherit}

/* ══ app shell ══ */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{height:var(--hdrh);background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0;gap:8px}
header h1{color:#fff;font-size:17px;font-weight:700;white-space:nowrap}
.hdr-btn{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:18px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
.hdr-btn:active{background:rgba(255,255,255,.32)}
#sync-dot{width:8px;height:8px;border-radius:50%;background:#8bc34a;flex-shrink:0}
#sync-dot.pending{background:#ffc107}
#sync-dot.syncing{background:#ffc107;animation:pulse 1s infinite}
#sync-dot.error{background:#f44336}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#content{flex:1;overflow-y:auto;padding-bottom:calc(var(--tabh) + 14px);-webkit-overflow-scrolling:touch}
#content::-webkit-scrollbar{width:4px}
#content::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
nav.tabbar{height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--sur);display:flex;border-top:1px solid var(--bdr);position:fixed;bottom:0;left:0;width:100%;z-index:100}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;color:var(--txm);font-size:10px;font-weight:500;cursor:pointer;font-family:inherit}
.tab-btn .icon{font-size:20px;line-height:1.15}
.tab-btn.active{color:var(--pri);font-weight:700}
.tab-panel{display:none;padding:12px;max-width:640px;margin:0 auto}
.tab-panel.active{display:block}
#p-board{max-width:1180px}

/* ══ cards / common ══ */
.card{background:var(--sur);border-radius:var(--rad);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.card-title{font-size:11px;font-weight:700;color:var(--txm);letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.cs{padding:10px 0;border-bottom:1px solid var(--bg)}
.cs:last-child{border-bottom:none;padding-bottom:0}
.cs:first-child{padding-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;width:100%}
.btn-g{background:var(--g);color:#fff;width:100%}
.btn-s{background:var(--pril);color:var(--pri)}
.btn-d{background:var(--rl);color:var(--r)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
label{display:block;font-size:13px;color:var(--txm);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],textarea,select{
  width:100%;padding:9px 11px;border:1.5px solid var(--bdr);border-radius:10px;
  font-size:14px;background:#fff;color:var(--tx);outline:none;transition:border-color .2s;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--pri)}
textarea{resize:vertical;min-height:56px}
.field{margin-bottom:12px}
.frow{display:flex;gap:10px}
.frow .field{flex:1}
.hint{font-size:11px;color:var(--txm);margin-top:3px;line-height:1.55}
.empty{text-align:center;padding:32px 16px;color:var(--txm)}
.empty .ei{font-size:38px;margin-bottom:10px}
.empty p{font-size:13px;line-height:1.6}

/* banner */
.banner{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:var(--rad);padding:12px 14px;margin-bottom:10px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.b-big{font-size:19px;font-weight:700}
.b-sub{font-size:11px;opacity:.82;margin-top:1px}
.b-st{font-size:12px;opacity:.92}

/* slider */
.sl-wrap{display:flex;align-items:center;gap:6px}
.sl-wrap input[type=range]{flex:1;accent-color:var(--g);cursor:pointer;padding:0;border:none}
.sl-val{font-size:15px;font-weight:700;color:var(--g);min-width:44px;text-align:right;flex-shrink:0}
.sl-min{font-size:11px;color:var(--txm);flex-shrink:0}
/* number input row */
.num-row{display:flex;align-items:center;gap:8px}
.num-row input{max-width:150px;min-width:0;text-align:center;font-weight:700;font-size:16px}
.num-unit{font-size:13px;color:var(--txm);flex-shrink:0}
.num-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* tri buttons */
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tb{padding:9px 4px;border:2px solid var(--bdr);border-radius:10px;background:#fff;font-size:13px;font-weight:600;color:var(--txm);cursor:pointer;text-align:center;transition:all .15s;user-select:none;font-family:inherit}
.tb:active{transform:scale(.96)}
.tb.bad{border-color:var(--r);background:var(--rl);color:var(--r)}
.tb.ok{border-color:var(--o);background:var(--ol);color:var(--o)}
.tb.good{border-color:var(--g);background:var(--gl);color:var(--g)}

/* 1-5 selector */
.lv5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lb5{padding:7px 2px;border:2px solid var(--bdr);border-radius:10px;background:#fff;cursor:pointer;text-align:center;transition:all .15s;user-select:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:1px}
.lb5 .em{font-size:17px;line-height:1.2}
.lb5 .nm{font-size:9.5px;color:var(--txm);font-weight:600}
.lb5:active{transform:scale(.95)}
.lb5.on{border-color:var(--sel,#667eea);background:var(--selbg,#eef0fe)}
.lb5.on .nm{color:var(--sel,#667eea)}

/* tags */
.tag-cloud{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:20px;border:2px solid var(--bdr);background:#fff;font-size:13px;font-weight:500;color:var(--txm);cursor:pointer;user-select:none;transition:all .15s}
.chip:active{transform:scale(.95)}
.chip.on{color:#fff;border-color:transparent}
.chip-add{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:20px;border:2px dashed var(--bdr);background:transparent;font-size:13px;color:var(--txm);cursor:pointer}
.chip-add:active{background:var(--pril);border-color:var(--pri);color:var(--pri)}

/* supplement check rows */
.sl-list{display:flex;flex-direction:column;gap:7px}
.si{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg);cursor:pointer;transition:background .12s;user-select:none}
.si.on{background:var(--gl)}
.sc{width:22px;height:22px;border-radius:6px;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
.si.on .sc{background:var(--g);border-color:var(--g)}
.sc::after{content:'✓';color:#fff;font-size:12px;font-weight:700;display:none}
.si.on .sc::after{display:block}
.si-info{flex:1;min-width:0}
.si-name{font-size:14px;font-weight:500}
.si-dose{font-size:11px;color:var(--txm)}
.si-cat{font-size:11px;padding:2px 7px;border-radius:9px;background:var(--bl);color:var(--b);flex-shrink:0}

/* today mini task list */
.tt{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:var(--bg);margin-bottom:6px;cursor:pointer}
.tt:last-child{margin-bottom:0}
.tt-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tt-info{flex:1;min-width:0}
.tt-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-meta{font-size:11px;color:var(--txm);margin-top:1px}
.tt-meta .ov{color:var(--r);font-weight:700}
.tt-meta .sn{color:var(--o);font-weight:600}
.tt-done{flex-shrink:0;border:1.5px solid var(--bdr);background:#fff;border-radius:8px;padding:4px 9px;font-size:11.5px;color:var(--txm);cursor:pointer;font-family:inherit}
.tt-done:active{background:var(--gl);color:var(--g);border-color:var(--g)}

/* log list */
.li{background:var(--sur);border-radius:var(--rad);padding:11px 13px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer}
.li-date{font-size:14px;font-weight:600;margin-bottom:5px}
.li-date small{font-size:11px;color:var(--txm);font-weight:400;margin-left:5px}
.li-meta{display:flex;gap:6px;flex-wrap:wrap}
.lt{font-size:11px;padding:3px 8px;border-radius:7px}
.tg{background:var(--gl);color:var(--g)}
.to{background:var(--ol);color:var(--o)}
.tb2{background:var(--bl);color:var(--b)}
.tp2{background:var(--pril);color:var(--pri)}
.li-journal{font-size:12px;color:var(--txm);margin-top:6px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* lab */
.lab-card{background:var(--sur);border-radius:var(--rad);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.lab-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.lab-dt{font-size:14px;font-weight:600}
.lab-lb{font-size:11px;color:var(--txm)}
.lab-tp{font-size:11px;padding:3px 8px;border-radius:8px;background:var(--bl);color:var(--b)}
.lab-vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:6px}
.lv{background:var(--bg);border-radius:9px;padding:7px 10px}
.lv.out{background:var(--rl)}
.lv-n{font-size:10px;color:var(--txm);margin-bottom:2px}
.lv-v{font-size:15px;font-weight:700}
.lv.out .lv-v{color:var(--r)}
.lv-u{font-size:10px;color:var(--txm)}
.lv-r{font-size:9px;color:var(--txm);margin-top:2px}
.lab-note{font-size:12px;color:var(--txm);margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr)}
.lmr{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.lmn{font-size:13px;font-weight:600;min-width:72px}

/* supp mgmt */
.smi{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr)}
.smi:last-child{border-bottom:none}
.smi-info{flex:1;min-width:0}
.smi-name{font-size:13px;font-weight:500}
.smi-detail{font-size:11px;color:var(--txm);margin-top:2px}
.smi-act{display:flex;gap:5px;flex-shrink:0}

/* ══ bottom sheet (generic modal) ══ */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
.mo.open{display:flex}
.sheet{background:var(--sur);border-radius:20px 20px 0 0;padding:20px 16px 30px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;animation:su .22s ease}
@keyframes su{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.m-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.m-close{font-size:22px;color:var(--txm);background:none;border:none;cursor:pointer;font-family:inherit}
@media(min-width:700px){.mo{align-items:center}.sheet{border-radius:18px;max-height:86vh}}

/* detail overlay */
#det{display:none;position:fixed;inset:0;background:var(--bg);z-index:150;overflow-y:auto}
#det.open{display:block}
.det-hdr{position:sticky;top:0;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:10}
.det-back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;font-family:inherit}
.det-hdr h2{font-size:16px;font-weight:600;flex:1}
.det-body{padding:13px;max-width:640px;margin:0 auto}
.tr{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--bdr);gap:10px}
.tr:last-child{border-bottom:none}
.tr-l{color:var(--txm);flex-shrink:0}
.tr-v{font-weight:600;text-align:right}

/* ══ reminders ══ */
.reminder-strip{display:none;background:#fff8f0;border:1px solid #fed7aa;border-radius:var(--rad);padding:9px 11px;margin-bottom:10px;gap:7px;flex-wrap:wrap;align-items:center}
.reminder-strip.has-items{display:flex}
.reminder-strip-label{font-size:11px;font-weight:700;color:#9a3412;letter-spacing:.5px}
.reminder-card{background:#fff;border:1px solid var(--bdr);border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.reminder-card .cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.reminder-card .rem-title{font-weight:600;color:var(--tx)}
.reminder-card .rem-when{color:var(--txm);font-size:11px}
.reminder-card.due-today{border-color:#fc8181;background:#fff5f5}
.reminder-card.due-today .rem-when{color:#c53030;font-weight:700}
.reminder-card.due-tomorrow{border-color:#fbd38d}
.reminder-card .rem-dismiss{margin-left:2px;background:none;border:none;cursor:pointer;color:#cbd5e0;font-size:14px;padding:0 2px;line-height:1;font-family:inherit}
.cat-work .cat-dot{background:#f6ad55}
.cat-life .cat-dot{background:#68d391}
.cat-research .cat-dot{background:#63b3ed}
.cat-meeting .cat-dot{background:#b794f4}
.rem-list{display:flex;flex-direction:column;gap:8px}
.rem-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--bdr);border-radius:10px;cursor:pointer;background:#fff}
.rem-item:active{border-color:var(--pri);background:var(--pril)}
.rem-item .cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.rem-item .rem-info{flex:1;min-width:0}
.rem-item .rem-info-title{font-weight:600;font-size:13.5px}
.rem-item .rem-info-sub{font-size:11.5px;color:var(--txm);margin-top:3px}
.rem-item.expired{opacity:.55}
.rem-item.dismissed{opacity:.6;background:#f1f3f5}
.rem-cond{display:none}
.rem-cond.active{display:block}

/* ══ kanban board ══ */
.stats-bar{background:var(--sur);border-radius:var(--rad);box-shadow:var(--sh);padding:9px 13px;display:flex;gap:14px;font-size:12.5px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.stat{display:flex;align-items:center;gap:5px;color:var(--txm)}
.stat strong{color:var(--tx)}
.saved-tag{margin-left:auto;font-size:11px;color:#a0aec0}
.board{display:flex;gap:12px;align-items:flex-start}
.col{background:#e9edf5;border-radius:12px;min-width:0;flex:1;display:flex;flex-direction:column}
.col-header{padding:10px 14px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;border-bottom:2px solid transparent}
.col-todo .col-header{color:#4a5568;border-color:#a0aec0}
.col-inprogress .col-header{color:#2b6cb0;border-color:#63b3ed}
.col-done .col-header{color:#276749;border-color:#68d391}
.col-count{background:rgba(0,0,0,.1);border-radius:10px;padding:1px 7px;font-size:12px}
.col-cards{padding:8px;display:flex;flex-direction:column;gap:7px;min-height:60px;flex:1}
.add-col-btn{margin:0 8px 8px;padding:7px;border:2px dashed #cbd5e0;border-radius:8px;background:transparent;color:var(--txm);cursor:pointer;font-size:12px;text-align:center;font-family:inherit}
.add-col-btn:active{border-color:var(--pri);color:var(--pri)}
.kcard{background:#fff;border-radius:9px;padding:11px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid transparent;cursor:pointer}
.kcard.p-urgent{border-left-color:#fc8181;background:#fff8f8}
.kcard.p-high{border-left-color:#f6ad55}
.kcard.p-medium{border-left-color:#68d391}
.kcard.p-low{border-left-color:#76e4f7}
.kcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:7px}
.kcard-title{font-weight:600;font-size:13.5px;flex:1}
.pbadge{padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0}
.pb-urgent{background:#fed7d7;color:#c53030;animation:pulse 1.8s infinite}
.pb-high{background:#feebc8;color:#c05621}
.pb-medium{background:#c6f6d5;color:#276749}
.pb-low{background:#bee3f8;color:#2c5282}
.kcard-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.proj-tag{padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}
.proj-np{background:#fef3c7;color:#92400e}
.proj-zf{background:#e0f2fe;color:#075985}
.proj-lh{background:#fce7f3;color:#9d174d}
.proj-seminar{background:#ede9fe;color:#5b21b6}
.proj-life{background:#dcfce7;color:#166534}
.proj-default{background:#e9d8fd;color:#6b46c1}
.dl-tag{font-size:11px;color:var(--txm)}
.dl-overdue{color:#e53e3e;font-weight:700}
.dl-soon{color:#dd6b20;font-weight:600}
.secondary-badge{font-size:10px;color:#a0aec0;background:#f7fafc;border:1px solid #e2e8f0;padding:1px 6px;border-radius:8px;white-space:nowrap}
.kcard-note{font-size:11.5px;color:var(--txm);font-style:italic;margin-bottom:5px}
.subtasks{margin-top:7px;border-top:1px solid var(--bdr);padding-top:7px}
.sub-prog{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.prog-bar{flex:1;height:4px;background:#e2e8f0;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:2px;transition:width .3s}
.sub-item{display:flex;align-items:center;gap:5px;padding:2px 0;font-size:12px;color:var(--txm)}
.sub-item input{cursor:pointer;width:13px;height:13px;accent-color:var(--pri)}

.act-btn.del:active{background:#fff5f5;color:#e53e3e;border-color:#fc8181}
.kempty{text-align:center;padding:24px 12px;color:#a0aec0;font-size:13px}
/* board status pills (mobile) */
.bpills{display:none;gap:6px;margin-bottom:10px}
.bpill{flex:1;padding:9px 4px;border:none;border-radius:10px;background:var(--sur);color:var(--txm);font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--sh);font-family:inherit}
.bpill.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}

  .bpills{display:flex}

}

/* subtask editor in task sheet */
.sub-editor{border:1.5px solid var(--bdr);border-radius:10px;overflow:hidden}
.sub-edit-list{padding:7px;display:flex;flex-direction:column;gap:4px}
.sei{display:flex;align-items:center;gap:5px;padding:3px 5px;border-radius:5px;background:var(--bg)}
.sei input[type=checkbox]{cursor:pointer;width:14px;height:14px;accent-color:var(--pri);flex-shrink:0}
.sei input[type=text]{flex:1;border:none;background:transparent;font-size:12.5px;color:var(--tx);padding:4px}
.sei input[type=text]:focus{outline:none}
.sei-rm{color:var(--txm);cursor:pointer;font-size:16px;line-height:1;padding:0 4px;border:none;background:none;font-family:inherit}
.sub-add-row{padding:7px;border-top:1px solid var(--bdr);display:flex;gap:5px;align-items:center}
.sub-add-row input{flex:1;border:none;font-size:12.5px;color:var(--tx);padding:4px 5px}
.sub-add-row input:focus{outline:none}

/* more tab pills */
.pills{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pill{padding:8px 14px;border:none;border-radius:18px;background:var(--sur);color:var(--txm);font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--sh);font-family:inherit}
.pill.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}

/* summary charts */
.chart-wrap{width:100%;overflow:hidden}
.chart-wrap svg{width:100%;height:auto;display:block}
.sum-section{margin-bottom:14px}
.tag-stat{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bdr);font-size:13px}
.tag-stat:last-child{border-bottom:none}
.tag-bar-bg{flex:1;height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.tag-bar-fill{height:100%;border-radius:3px;transition:width .4s}

/* toast */
#toast{position:fixed;bottom:calc(var(--tabh) + 16px);left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:16px;font-size:13px;z-index:500;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center}
#toast.show{opacity:1}
</style>

<body>

<!-- ══ PIN lock ══ -->
<div id="lock">
  <div class="lk-logo">🧭</div>
  <div class="lk-title">Daily Hub</div>
  <div class="lk-sub">任务 · 生理 · 心理 —— 一站式每日面板<br>输入 PIN 解锁此设备（只需一次）</div>

</div>

<!-- generic bottom sheet -->

<script>
// ═══════════════════════════════════════════════════════════
//  Daily Hub — 任务 + 生理 + 心理 一站式每日面板
//  Frontend: GitHub Pages · Backend: GitHub Gist (REST API)
//  凭据经 PIN(PBKDF2-SHA256 600k + AES-256-GCM) 加密内置
// ═══════════════════════════════════════════════════════════

// ── encrypted credential vault (generated offline; PIN required to open) ──
const VAULT={
  iter:600000,
  salt:'sy10IXLW5RVXXIeCj2e/Kg==',
  iv:'mFTGcFd09gM4NFxP',
  ct:'k91c9BLIe3anXdHQ7pTKIH7+oqteqeu2nuaIPkcQR7FykGO3jqdmdQr157aFfvINDG5MQOB+nSfp1WzwxZ92evtvBwBx4cuKtBZzKRfxTkatJ2PbenNajKzOjK23LkBt4cBSd2wJsEjdSgI6g5ie3icUo9Xerr0csgpjcjOglVNhoxBv8AmQMSqcR4XbPzxQMphgWxoHJcVMWiGIAkucz8r6'
};

const CRED_KEY='dh-creds-v1', CACHE_KEY='dh-cache-v1', TAB_KEY='dh-tab-v1', RANGE_KEY='dh-ranges-v1';
const HUB_FILE='daily-hub-data.json';
const LEGACY_KANBAN_FILE='kanban-data.json', LEGACY_HEALTH_FILE='health-data.json';
const SAVE_DEBOUNCE_MS=1500;
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),del:k=>localStorage.removeItem(k)};

const SLQ={1:'很差',2:'一般',3:'非常不错'}, SLC={1:'bad',2:'ok',3:'good'};
const ENL={1:'萎靡',2:'一般',3:'充沛'},   ENC={1:'bad',2:'ok',3:'good'};
const MOOD_DEF={color:'#667eea',bg:'#eef0fe',items:[[1,'😞','很差'],[2,'😕','不佳'],[3,'😐','一般'],[4,'🙂','不错'],[5,'😄','很好']]};
const STRESS_DEF={color:'#d93025',bg:'#fdecea',items:[[1,'😌','很松弛'],[2,'🙂','偏低'],[3,'😐','中等'],[4,'😣','偏高'],[5,'🤯','爆表']]};
const FOCUS_DEF={color:'#1a73e8',bg:'#e8f0fe',items:[[1,'🐌','涣散'],[2,'😕','偏低'],[3,'😐','一般'],[4,'🎯','专注'],[5,'🚀','心流']]};
const PSY_LABEL={mood:'情绪',stress:'压力',focus:'专注'};
const DEF_TAGS=[{id:1,name:'经期',icon:'🔴',color:'#e91e63'},{id:2,name:'16:8 断食',icon:'⏰',color:'#1a73e8'},{id:3,name:'运动 10min',icon:'🏃',color:'#e67e22'}];

// ── state ──
let CREDS=null;
let data=null;
let saveTimer=null, lastSavedAt=null, lastFocusReload=0;
let editId=null, editReminderId=null, tmpSubs=[];
let curDetId=null, curBoardSec='board', curLogSec='logs';
let slRanges=Object.assign({sleepMin:0,sleepMax:12,wtMin:45,wtMax:60},LS.get(RANGE_KEY)||{});

// ── small helpers ──
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg,dur=2600){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),dur)}
function localDate(d){d=d||new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function today(){return localDate()}
function fmtD(d){const dt=new Date(d+'T00:00:00');return d.slice(5).replace('-','/')+' 周'+'日一二三四五六'[dt.getDay()]}
function b64d(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}

// ══ PIN unlock ══
function lkErr(m){document.getElementById('lk-err').textContent=m||''}
async function decryptVault(pin){
  if(!crypto||!crypto.subtle)throw new Error('nosubtle');
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64d(VAULT.salt),iterations:VAULT.iter,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(VAULT.iv)},key,b64d(VAULT.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryUnlock(){
  const pin=document.getElementById('pin-inp').value.trim();
  if(!pin){lkErr('请输入 PIN');return}
  const btn=document.getElementById('lk-btn');
  btn.disabled=true;btn.textContent='解锁中…';lkErr('');
  try{
    const creds=await decryptVault(pin);
    LS.set(CRED_KEY,creds);CREDS=creds;
    startApp();
  }catch(e){
    if(String(e.message).includes('nosubtle')){lkErr('此环境不支持加密解锁（需要 HTTPS），请用下方手动凭据');}
    else{lkErr('PIN 不正确，请重试');}
    const box=document.getElementById('lk-box');
    box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
    document.getElementById('pin-inp').select();
  }finally{btn.disabled=false;btn.textContent='解锁'}
}
function manualUnlock(){
  const g=document.getElementById('lk-gid').value.trim();
  const t=document.getElementById('lk-tok').value.trim();
  if(!g||!t){lkErr('手动模式需要填写 Gist ID 和 Token');return}
  const creds={gistId:g,token:t};
  LS.set(CRED_KEY,creds);CREDS=creds;startApp();
}
function loadCreds(){const c=LS.get(CRED_KEY);return(c&&c.gistId&&c.token)?c:null}
function lockDevice(){
  if(!confirm('锁定此设备？\n\n将清除本机保存的凭据和缓存（云端数据不受影响），下次打开需要重新输入 PIN。'))return;
  LS.del(CRED_KEY);LS.del(CACHE_KEY);location.reload();
}

// ══ gist API ══
function ghHeaders(){return{'Authorization':'token '+CREDS.token,'Accept':'application/vnd.github+json'}}
async function ghGET(url){
  const r=await fetch(url,{headers:ghHeaders(),cache:'no-store'});
  if(!r.ok)throw new Error('GET '+r.status);
  return r.json();
}
async function fileContent(f){
  if(!f)return null;
  if(f.truncated){const r=await fetch(f.raw_url,{cache:'no-store'});return r.text()}
  return f.content;
}
async function patchHub(){
  data.version=1;data.exportedAt=new Date().toISOString();
  const r=await fetch('https://api.github.com/gists/'+CREDS.gistId,{
    method:'PATCH',
    headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),
    body:JSON.stringify({files:{[HUB_FILE]:{content:JSON.stringify(data,null,2)}}})
  });
  if(!r.ok)throw new Error('PATCH '+r.status);
  lastSavedAt=new Date();
}

// ── one-time legacy migration (runs in browser on first unlock) ──
function mergeLegacy(kb,hr){
  kb=kb||{};hr=hr||{};
  const tasks=Array.isArray(kb.tasks)?kb.tasks:[];
  const reminders=Array.isArray(kb.reminders)?kb.reminders:[];
  const logs=(Array.isArray(hr.dailyLogs)?hr.dailyLogs:[]).map(l=>Object.assign({mood:0,stress:0,focus:0,journal:''},l));
  const supps=Array.isArray(hr.supplements)?hr.supplements:[];
  const labs=Array.isArray(hr.labResults)?hr.labResults:[];
  const tagDefs=(hr.tagDefs&&hr.tagDefs.length)?hr.tagDefs:DEF_TAGS.map(t=>({...t}));
  return{
    version:1,exportedAt:new Date().toISOString(),
    tasks,nextId:Number.isFinite(kb.nextId)?kb.nextId:tasks.reduce((m,t)=>Math.max(m,t.id||0),0)+1,
    reminders,nextReminderId:Number.isFinite(kb.nextReminderId)?kb.nextReminderId:reminders.reduce((m,r)=>Math.max(m,r.id||0),0)+1,
    supplements:supps,
    dailyLogs:logs,nextLogId:Number.isFinite(hr.nextLogId)?hr.nextLogId:logs.reduce((m,l)=>Math.max(m,l.id||0),0)+1,
    labResults:labs,nextLabId:Number.isFinite(hr.nextLabId)?hr.nextLabId:labs.reduce((m,l)=>Math.max(m,l.id||0),0)+1,
    tagDefs,nextTagId:Number.isFinite(hr.nextTagId)?hr.nextTagId:tagDefs.reduce((m,t)=>Math.max(m,t.id||0),9)+1,
    migratedAt:new Date().toISOString()
  };
}
async function migrateLegacy(gistRes){
  toast('首次运行：正在合并旧看板 + 健康数据…',6000);
  const kc=await fileContent(gistRes.files&&gistRes.files[LEGACY_KANBAN_FILE]);
  const kb=kc?JSON.parse(kc):null;
  let hr=null;
  if(CREDS.healthGistId){
    const hres=await ghGET('https://api.github.com/gists/'+CREDS.healthGistId);
    const hc=await fileContent(hres.files&&hres.files[LEGACY_HEALTH_FILE]);
    hr=hc?JSON.parse(hc):null;
  }
  if(!kb&&!hr)throw new Error('未找到任何旧数据（kanban-data.json / health-data.json）');
  data=mergeLegacy(kb,hr);
  await patchHub();
  toast('✅ 一次性迁移完成：任务 '+data.tasks.length+' 条 · 日志 '+data.dailyLogs.length+' 条已合并',5000);
}

function ensureShape(){
  if(!data)data={};
  data.tasks=data.tasks||[];data.reminders=data.reminders||[];
  data.supplements=data.supplements||[];data.dailyLogs=data.dailyLogs||[];
  data.labResults=data.labResults||[];
  data.tagDefs=(data.tagDefs&&data.tagDefs.length)?data.tagDefs:DEF_TAGS.map(t=>({...t}));
  if(!Number.isFinite(data.nextId))data.nextId=data.tasks.reduce((m,t)=>Math.max(m,t.id||0),0)+1;
  if(!Number.isFinite(data.nextReminderId))data.nextReminderId=data.reminders.reduce((m,r)=>Math.max(m,r.id||0),0)+1;
  if(!Number.isFinite(data.nextLogId))data.nextLogId=data.dailyLogs.reduce((m,l)=>Math.max(m,l.id||0),0)+1;
  if(!Number.isFinite(data.nextLabId))data.nextLabId=data.labResults.reduce((m,l)=>Math.max(m,l.id||0),0)+1;
  if(!Number.isFinite(data.nextTagId))data.nextTagId=data.tagDefs.reduce((m,t)=>Math.max(m,t.id||0),9)+1;
  data.dailyLogs.forEach(l=>{
    if(l.mood==null)l.mood=0;if(l.stress==null)l.stress=0;if(l.focus==null)l.focus=0;
    if(l.journal==null)l.journal='';if(!l.tags)l.tags=[];if(l.weight===undefined)l.weight=null;
    if(!l.supplements)l.supplements={};
  });
}

// ── sync orchestration ──
function setSS(s,lb){
  const d=document.getElementById('sync-dot');if(!d)return;
  d.className=s==='ok'?'':s;
  document.getElementById('sync-lb').textContent=lb||(s==='syncing'?'同步中':s==='pending'?'待同步':s==='error'?'失败':'已同步');
  d.dataset.state=s;
}
async function reloadFromCloud(){
  if(!CREDS)return;
  setSS('syncing');
  try{
    const res=await ghGET('https://api.github.com/gists/'+CREDS.gistId);
    const f=res.files&&res.files[HUB_FILE];
    if(f){const c=await fileContent(f);data=JSON.parse(c)}
    else{await migrateLegacy(res)}
    ensureShape();saveCacheAll();setSS('ok');renderAll();
  }catch(e){
    console.error(e);setSS('error');
    if(!data&&loadCache()){ensureShape();renderAll();toast('⚠️ 离线模式（云端加载失败：'+e.message+'）')}
    else toast('❌ 加载失败：'+e.message);
  }
}
function saveCacheAll(){try{LS.set(CACHE_KEY,{data,cachedAt:new Date().toISOString()})}catch(e){}}
function loadCache(){const c=LS.get(CACHE_KEY);if(c&&c.data){data=c.data;return true}return false}
function scheduleSave(){
  if(!CREDS||!data)return;
  if(saveTimer)clearTimeout(saveTimer);
  setSS('pending');
  saveTimer=setTimeout(actuallySave,SAVE_DEBOUNCE_MS);
}
async function actuallySave(){
  if(!CREDS||!data)return;
  saveTimer=null;setSS('syncing','保存中');
  try{await patchHub();saveCacheAll();setSS('ok')}
  catch(e){console.error(e);setSS('error');toast('❌ 保存失败：'+e.message+'（本地已缓存，可点同步重试）')}
}
function flushSave(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null}return actuallySave()}
function persist(){saveCacheAll();renderAll();scheduleSave()}
function touchToday(){saveCacheAll();scheduleSave()}
function onSyncClick(){
  const st=document.getElementById('sync-dot').dataset.state;
  if(st==='pending'||saveTimer){flushSave();return}

// ══════════════════ KANBAN（看板）══════════════════
function normalizeBoard(){
  const groups={};
  data.tasks.forEach(t=>{const k=t.project||'';(groups[k]=groups[k]||[]).push(t)});
  let changed=false;
  Object.values(groups).forEach(group=>{
    const active=group.filter(t=>t.status!=='done').sort((a,b)=>a.id-b.id);
    active.forEach((t,i)=>{
      const want=i===0?'inprogress':'todo';
      if(t.status!==want){t.status=want;changed=true}
    });
  });
  return changed;
}
function priority(dl){
  if(!dl)return'low';
  const d=Math.ceil((new Date(dl+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
  if(d<0||d<=2)return'urgent';if(d<=7)return'high';if(d<=14)return'medium';return'low';
}
function pLabel(p){return{urgent:'🔴 紧急',high:'🟠 较高',medium:'🟢 一般',low:'🔵 较低'}[p]}
function pOrder(p){return{urgent:0,high:1,medium:2,low:3}[p]}
function pFromOrder(o){return['urgent','high','medium','low'][o]}
let EFF={};
function computeEff(){
  EFF={};
  const byProj={};
  for(const t of data.tasks){
    if(t.status==='done')continue;
    (byProj[t.project||'']=byProj[t.project||'']||[]).push(t);
  }
  for(const list of Object.values(byProj)){
    list.sort((a,b)=>a.id-b.id);
    let best=3;
    for(let i=list.length-1;i>=0;i--){
      best=Math.min(best,pOrder(priority(list[i].deadline)));
      EFF[list[i].id]=best;
    }
  }
}
function effPriority(t){
  if(t.status==='done')return'low';
  return EFF[t.id]!=null?pFromOrder(EFF[t.id]):priority(t.deadline);
}
function dlInfo(dl){
  if(!dl)return null;
  const d=Math.ceil((new Date(dl+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
  if(d<0)return{txt:'⚠ 已逾期'+(-d)+'天',cls:'dl-overdue'};
  if(d===0)return{txt:'⚡ 今天截止',cls:'dl-soon'};
  if(d===1)return{txt:'⚡ 明天截止',cls:'dl-soon'};
  return{txt:'📅 '+dl,cls:''};
}
function projClass(p){
  return{'NP 投稿':'proj-np','IR paper':'proj-np','ZF Study':'proj-zf','LH Model':'proj-lh','Seminar':'proj-seminar','生活':'proj-life'}[p]||'proj-default';
}
const PROJ_DOT={'NP 投稿':'#f6ad55','IR paper':'#f6ad55','ZF Study':'#38bdf8','LH Model':'#f9a8d4','Seminar':'#c4b5fd','生活':'#34d399'};
const PROJ_PALETTE=['#fb923c','#22d3ee','#a3e635','#f472b6','#60a5fa','#facc15','#2dd4bf','#c084fc'];
function projDot(p){
  if(PROJ_DOT[p])return PROJ_DOT[p];
  let h=0;for(const ch of String(p||''))h=(h*31+ch.charCodeAt(0))>>>0;
  return PROJ_PALETTE[h%PROJ_PALETTE.length];
}
function renderBoard(){
  if(normalizeBoard())scheduleSave();
  computeEff();
  ['todo','inprogress','done'].forEach(s=>{
    let ts=data.tasks.filter(t=>t.status===s);
    if(s!=='done')ts.sort((a,b)=>{
      const pa=pOrder(effPriority(a)),pb=pOrder(effPriority(b));
      if(pa!==pb)return pa-pb;
      return(a.deadline||'zzzz').localeCompare(b.deadline||'zzzz');
    });
    else ts.sort((a,b)=>{
      const ka=a.completedAt||a.deadline||'',kb=b.completedAt||b.deadline||'';
      if(ka!==kb)return kb.localeCompare(ka);
      return b.id-a.id;
    });
    document.getElementById('cnt-'+s).textContent=ts.length;
    document.getElementById('bp-cnt-'+s).textContent=ts.length;
    const c=document.getElementById('cards-'+s);
    c.innerHTML=ts.length?ts.map(renderKCard).join(''):'<div class="kempty">📭 暂无任务</div>';
  });
  renderStats();
}
function renderKCard(t){
  const p=effPriority(t);
  const escalated=t.status!=='done'&&pOrder(p)<pOrder(priority(t.deadline));
  const dl=t.status==='done'?(t.deadline?{txt:'📅 '+t.deadline,cls:''}:null):dlInfo(t.deadline);
  const isLH=t.project==='LH Model';
  const subList=t.subtasks||[];
  const ds=subList.filter(s=>s.done).length,tc=subList.length;
  const pct=tc?Math.round(ds/tc*100):0;
  const subs=tc?`<div class="subtasks">
    <div class="sub-prog"><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div><span style="font-size:11px;color:var(--txm)">${ds}/${tc}</span></div>
    ${subList.map((s,i)=>`<div class="sub-item${s.done?' done':''}"><input type="checkbox"${s.done?' checked':''} onclick="toggleSub(${t.id},${i});event.stopPropagation()"><span>${esc(s.text)}</span></div>`).join('')}
  </div>`:'';
  const mvBtns={
    todo:`<button class="act-btn" onclick="mv(${t.id},'inprogress');event.stopPropagation()">→ 进行中</button>`,
    inprogress:`<button class="act-btn" onclick="mv(${t.id},'todo');event.stopPropagation()">← 待办</button><button class="act-btn" onclick="mv(${t.id},'done');event.stopPropagation()">→ 完成 ✓</button>`,
    done:`<button class="act-btn" onclick="mv(${t.id},'inprogress');event.stopPropagation()">↩ 重启</button>`
  }[t.status];
  return`<div class="kcard p-${p}" onclick="openEdit(${t.id})">
    <div class="kcard-top">
      <div class="kcard-title">${esc(t.title)}</div>
      ${t.status!=='done'?(isLH?'<span class="secondary-badge">次优先</span>':`<span class="pbadge pb-${p}"${escalated?' title="被后续任务带动升级"':''}>${pLabel(p)}${escalated?' ↑':''}</span>`):''}
    </div>
    <div class="kcard-meta">
      ${t.project?`<span class="proj-tag ${projClass(t.project)}">${esc(t.project)}</span>`:''}
      ${dl?`<span class="dl-tag ${dl.cls}">${dl.txt}</span>`:''}
    </div>
    ${t.note?`<div class="kcard-note">${esc(t.note)}</div>`:''}
    ${subs}
    <div class="kcard-actions" onclick="event.stopPropagation()">
      ${mvBtns}
      <button class="act-btn" onclick="openEdit(${t.id});event.stopPropagation()">✏ 编辑</button>
      <button class="act-btn del" onclick="delTask(${t.id});event.stopPropagation()">🗑</button>
    </div>
  </div>`;
}
function renderStats(){
  const urg=data.tasks.filter(t=>t.status!=='done'&&effPriority(t)==='urgent').length;
  const order=[],firstId={};
  for(const t of data.tasks){
    const p=t.project||'其他';
    if(!(p in firstId)){firstId[p]=t.id;order.push(p)}
    else firstId[p]=Math.min(firstId[p],t.id);
  }
  order.sort((a,b)=>firstId[a]-firstId[b]);
  const prog=proj=>{
    const d=data.tasks.filter(t=>(t.project||'其他')===proj);
    return d.filter(t=>t.status==='done').length+'/'+d.length;
  };
  document.getElementById('statsBar').innerHTML=
    order.map(p=>`<div class="stat"><div class="dot" style="background:${projDot(p)}"></div>${esc(p)}：<strong>${prog(p)}</strong></div>`).join('')+
    (urg?`<div class="stat" style="color:#e53e3e"><div class="dot" style="background:#fc8181"></div>🔴 紧急：<strong>${urg} 项</strong></div>`:'')+
    (lastSavedAt?`<div class="saved-tag">💾 ${lastSavedAt.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div>`:'');
}

  };

}

// ══════════════════ REMINDERS（提醒）══════════════════
function lastDayOfMonth(y,m){return new Date(y,m+1,0).getDate()}
function nextOccurrence(rem,from){
  const f=new Date(from);f.setHours(0,0,0,0);
  switch(rem.recurrence){
    case 'once':{
      if(!rem.date)return null;
      return new Date(rem.date+'T00:00:00');
    }
    case 'weekly':{
      const dow=parseInt(rem.dayOfWeek,10);if(isNaN(dow))return null;
      const d=new Date(f);d.setDate(d.getDate()+((dow-d.getDay()+7)%7));return d;
    }
    case 'monthly':{
      const dom=parseInt(rem.dayOfMonth,10);if(isNaN(dom))return null;
      let y=f.getFullYear(),m=f.getMonth();
      let day=Math.min(dom,lastDayOfMonth(y,m));
      let d=new Date(y,m,day);
      if(d<f){m++;if(m>11){m=0;y++}day=Math.min(dom,lastDayOfMonth(y,m));d=new Date(y,m,day)}
      return d;
    }
    case 'monthly_lastday':{
      let y=f.getFullYear(),m=f.getMonth();
      let d=new Date(y,m,lastDayOfMonth(y,m));
      if(d<f){m++;if(m>11){m=0;y++}d=new Date(y,m,lastDayOfMonth(y,m))}
      return d;
    }
    case 'yearly':{
      const mo=parseInt(rem.month,10)-1,da=parseInt(rem.dayOfMonth,10);
      if(isNaN(mo)||isNaN(da))return null;
      let y=f.getFullYear();
      let d=new Date(y,mo,Math.min(da,lastDayOfMonth(y,mo)));
      if(d<f){y++;d=new Date(y,mo,Math.min(da,lastDayOfMonth(y,mo)))}
      return d;
    }
  }
  return null;
}
function daysUntilDate(date,from){
  const f=new Date(from);f.setHours(0,0,0,0);
  const d=new Date(date);d.setHours(0,0,0,0);
  return Math.round((d-f)/864e5);
}
function fmtWhen(date,days){
  if(days<0)return '已过 '+(-days)+'天';
  if(days===0)return '今天';if(days===1)return '明天';if(days===2)return '后天';
  if(days<=6)return days+'天后';
  return (date.getMonth()+1)+'/'+date.getDate();
}
function isReminderDismissed(rem,todayD){
  if(!rem.dismissedUntil)return false;
  try{return new Date(rem.dismissedUntil+'T00:00:00')>todayD}catch(e){return false}
}
function recurrenceSummary(rem){
  switch(rem.recurrence){
    case 'once':return '一次性 · '+(rem.date||'?');
    case 'weekly':return '每周'+['日','一','二','三','四','五','六'][rem.dayOfWeek];
    case 'monthly':return '每月 '+rem.dayOfMonth+' 号';
    case 'monthly_lastday':return '每月最后一天';
    case 'yearly':return '每年 '+rem.month+'/'+rem.dayOfMonth;
  }
  return '?';
}
function dueReminders(){
  const t=new Date();t.setHours(0,0,0,0);
  const due=[];
  data.reminders.forEach(rem=>{
    const next=nextOccurrence(rem,t);if(!next)return;
    const days=daysUntilDate(next,t);
    const advance=Math.max(2,Number.isFinite(rem.advanceDays)?rem.advanceDays:3);
    if(days>advance)return;
    if(isReminderDismissed(rem,t))return;
    due.push({rem,next,days});
  });
  due.sort((a,b)=>a.days-b.days);
  return due;
}
function reminderStripHtml(){
  const due=dueReminders();
  if(!due.length)return '';
  const cards=due.map(({rem,next,days})=>{
    const cat=rem.category||'life';
    const dueClass=days===0?'due-today':(days===1?'due-tomorrow':'');
    const when=fmtWhen(next,days)+(rem.time?' · '+rem.time:'');
    return `<div class="reminder-card cat-${cat} ${dueClass}" onclick="openReminderEdit(${rem.id})" title="${esc(rem.note||'')}">
      <span class="cat-dot"></span><span class="rem-title">${esc(rem.title)}</span>
      <span class="rem-when">${when}</span>
      <button class="rem-dismiss" onclick="dismissReminder(${rem.id});event.stopPropagation()" title="本次知道了">✕</button>
    </div>`;
  }).join('');
  return `<div class="reminder-strip has-items"><span class="reminder-strip-label">📅 即将到来</span>${cards}</div>`;
}
function dismissReminder(id){
  const rem=data.reminders.find(r=>r.id===id);if(!rem)return;
  const msg=rem.recurrence==='once'
    ?'关闭提醒「'+rem.title+'」？\n\n这是一次性提醒，关闭后将不再显示。'
    :'关闭本次提醒「'+rem.title+'」？\n\n这是重复提醒，本次关闭后下次仍会提醒。';
  if(!confirm(msg))return;
  const t=new Date();t.setHours(0,0,0,0);
  if(rem.recurrence==='once'){rem.dismissedUntil='9999-12-31'}
  else{
    const next=nextOccurrence(rem,t);
    if(next){rem.dismissedUntil=localDate(new Date(next.getTime()+86400000))}
  }
  persist();
}
function remsSectionHtml(){
  let listHtml;
  if(!data.reminders.length){
    listHtml='<div class="empty"><div class="ei">📅</div><p>还没有提醒</p></div>';
  }else{
    const t=new Date();t.setHours(0,0,0,0);
    const sorted=data.reminders.map(r=>({rem:r,next:nextOccurrence(r,t)}))
      .sort((a,b)=>{
        if(!a.next&&!b.next)return 0;
        if(!a.next)return 1;if(!b.next)return -1;
        return b.next-a.next;
      });
    listHtml='<div class="rem-list">'+sorted.map(({rem,next})=>{
      const cat=rem.category||'life';
      const expired=rem.recurrence==='once'&&!next;
      const dismissed=isReminderDismissed(rem,t);
      const meta=[recurrenceSummary(rem),next?('下次 '+(next.getMonth()+1)+'/'+next.getDate()):'已过期'];
      if(rem.time)meta.push(rem.time);
      if(rem.advanceDays)meta.push('提前 '+rem.advanceDays+'天');
      if(dismissed)meta.push('✕ 已关闭');
      return `<div class="rem-item cat-${cat}${expired?' expired':''}${dismissed?' dismissed':''}" onclick="openReminderEdit(${rem.id})">
        <span class="cat-dot"></span>
        <div class="rem-info">
          <div class="rem-info-title">${esc(rem.title)}</div>
          <div class="rem-info-sub">${meta.join(' · ')}${rem.note?' · '+esc(rem.note):''}</div>
        </div>
      </div>`;
    }).join('')+'</div>';
  }
  return '<button class="btn btn-p" style="margin-bottom:12px" onclick="openReminderEdit()">＋ 新建提醒</button>'+listHtml;
}
function openReminderEdit(id){
  editReminderId=id||null;
  const rem=id?data.reminders.find(r=>r.id===id):null;
  openSheet(rem?'编辑提醒':'添加提醒',`
    <div class="field"><label>标题 *</label><input type="text" id="rf-title" value="${esc(rem?rem.title:'')}" placeholder="例：提交 timesheet"/></div>
    <div class="frow">
      <div class="field"><label>分类</label><select id="rf-category">
        <option value="work">🟡 work</option><option value="life">🟢 life</option>
        <option value="research">🔵 research</option><option value="meeting">🟣 meeting</option></select></div>
      <div class="field"><label>提前几天</label><input type="number" id="rf-advance" min="2" max="30" value="${rem&&rem.advanceDays!=null?rem.advanceDays:3}"/></div>
    </div>
    <div class="field"><label>循环类型</label><select id="rf-recurrence" onchange="toggleRecurrenceFields()">
      <option value="once">一次性（指定日期）</option><option value="weekly">每周</option>

      <div class="field"><label>日 (1-31)</label><input type="number" id="rf-yearDay" min="1" max="31" value="${rem&&rem.recurrence==='yearly'&&rem.dayOfMonth?rem.dayOfMonth:''}"/></div>
    </div></div>

    <div class="field"><label>备注</label><textarea id="rf-note" rows="2" placeholder="可选">${esc(rem&&rem.note?rem.note:'')}</textarea></div>
    <div style="display:flex;gap:8px">
      ${rem?'<button class="btn btn-d" style="flex:0 0 auto" onclick="deleteCurrentReminder()">🗑 删除</button>':''}
      <button class="btn btn-p" style="flex:1" onclick="saveReminder()">保存</button>
    </div>`);
  document.getElementById('rf-category').value=rem?(rem.category||'life'):'work';
  document.getElementById('rf-recurrence').value=rem?rem.recurrence:'once';
  document.getElementById('rf-dow').value=rem&&rem.dayOfWeek!=null?rem.dayOfWeek:1;
  toggleRecurrenceFields();
}
function toggleRecurrenceFields(){
  const v=document.getElementById('rf-recurrence').value;
  ['rc-once','rc-weekly','rc-monthly','rc-yearly'].forEach(id=>document.getElementById(id).classList.remove('active'));
  if(v==='once')document.getElementById('rc-once').classList.add('active');
  else if(v==='weekly')document.getElementById('rc-weekly').classList.add('active');
  else if(v==='monthly')document.getElementById('rc-monthly').classList.add('active');
  else if(v==='yearly')document.getElementById('rc-yearly').classList.add('active');
}
function saveReminder(){
  const title=document.getElementById('rf-title').value.trim();
  if(!title){alert('请输入标题');return}
  const recurrence=document.getElementById('rf-recurrence').value;
  const r={
    title,
    category:document.getElementById('rf-category').value,
    advanceDays:Math.max(2,parseInt(document.getElementById('rf-advance').value,10)||2),
    recurrence,
    time:document.getElementById('rf-time').value||null,
    note:document.getElementById('rf-note').value.trim()
  };
  if(recurrence==='once'){
    r.date=document.getElementById('rf-date').value;
    if(!r.date){alert('一次性提醒需要选择日期');return}
  }else if(recurrence==='weekly'){
    r.dayOfWeek=parseInt(document.getElementById('rf-dow').value,10);
  }else if(recurrence==='monthly'){
    r.dayOfMonth=parseInt(document.getElementById('rf-dom').value,10);
    if(!r.dayOfMonth||r.dayOfMonth<1||r.dayOfMonth>31){alert('请输入 1-31 的日期');return}
  }else if(recurrence==='yearly'){
    r.month=parseInt(document.getElementById('rf-yearMonth').value,10);
    r.dayOfMonth=parseInt(document.getElementById('rf-yearDay').value,10);
    if(!r.month||!r.dayOfMonth){alert('请输入月和日');return}
  }
  if(editReminderId){
    const i=data.reminders.findIndex(x=>x.id===editReminderId);
    if(i>=0)data.reminders[i]={...data.reminders[i],...r};
  }else{
    data.reminders.push({id:data.nextReminderId++,...r});
  }
  closeSheet();persist();
}
function deleteCurrentReminder(){
  if(!editReminderId)return;
  if(!confirm('删除此提醒？'))return;
  data.reminders=data.reminders.filter(r=>r.id!==editReminderId);
  closeSheet();persist();
}

// ══════════════════ 今日（TODAY）══════════════════
function todayLog(){
  const ts=today();
  let log=data.dailyLogs.find(l=>l.date===ts);
  if(!log){
    log={id:data.nextLogId++,date:ts,sleep:{hoursSlept:7,quality:0},energy:{level:0},
      weight:null,tags:[],supplements:{},mood:0,stress:0,focus:0,journal:''};
    data.dailyLogs.push(log);
  }
  if(!log.tags)log.tags=[];if(log.weight===undefined)log.weight=null;
  if(!log.supplements)log.supplements={};
  if(log.mood==null)log.mood=0;if(log.stress==null)log.stress=0;if(log.focus==null)log.focus=0;
  if(log.journal==null)log.journal='';
  return log;
}

function setTri(gId,val,field){

  if(log.stress)b.push(`<span class="lt" style="background:${STRESS_DEF.bg};color:${STRESS_DEF.color}">${STRESS_DEF.items[log.stress-1][1]} 压力${log.stress}</span>`);
  if(log.focus)b.push(`<span class="lt" style="background:${FOCUS_DEF.bg};color:${FOCUS_DEF.color}">${FOCUS_DEF.items[log.focus-1][1]} 专注${log.focus}</span>`);

function genYTicks(min,max){
  const range=max-min;const step=range<=4?1:range<=8?2:5;
  const ticks=[];for(let v=Math.ceil(min/step)*step;v<=max;v+=step)ticks.push(v);return ticks;
}
function lineChart(series,xLbs,{minY,maxY,yTicks,color,fmtY}){
  const n=series.length;if(!n)return '<p style="color:var(--txm);text-align:center;padding:20px;font-size:13px">数据不足</p>';
  const VW=340,VH=130,PL=36,PR=8,PT=10,PB=26;
  const W=VW-PL-PR,H=VH-PT-PB;
  const sx=i=>PL+(n>1?i/(n-1):0.5)*W;
  const sy=v=>PT+H-(v-minY)/(maxY-minY)*H;
  const grid=yTicks.map(t=>`<line x1="${PL}" y1="${sy(t).toFixed(1)}" x2="${VW-PR}" y2="${sy(t).toFixed(1)}" stroke="#eee" stroke-width="1"/>
    <text x="${PL-4}" y="${(sy(t)+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#aaa">${fmtY?fmtY(t):t}</text>`).join('');
  const step=Math.max(1,Math.ceil(n/7));
  const xlb=xLbs.map((lb,i)=>i%step===0||i===n-1?`<text x="${sx(i).toFixed(1)}" y="${VH-2}" text-anchor="middle" font-size="8" fill="#aaa">${lb}</text>`:'').join('');
  let d='';let inp=false;
  series.forEach((s,i)=>{if(s.y===null||s.y===undefined){inp=false;return}
    const x=sx(i).toFixed(1),y=sy(s.y).toFixed(1);d+=inp?`L${x} ${y}`:`M${x} ${y}`;inp=true});
  const dots=series.map((s,i)=>s.y!==null&&s.y!==undefined?`<circle cx="${sx(i).toFixed(1)}" cy="${sy(s.y).toFixed(1)}" r="3" fill="${color}"/>`:'').join('');
  return `<svg viewBox="0 0 ${VW} ${VH}" style="width:100%;height:auto">
    <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+H}" stroke="#ddd" stroke-width="1"/>
    <line x1="${PL}" y1="${PT+H}" x2="${VW-PR}" y2="${PT+H}" stroke="#ddd" stroke-width="1"/>
    ${grid}${xlb}
    ${d?`<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${dots}</svg>`;
}
function multiLineChart(seriesList,xLbs,{minY,maxY,yTicks}){
  const n=xLbs.length;if(!n)return '';
  const VW=340,VH=150,PL=30,PR=8,PT=20,PB=26;
  const W=VW-PL-PR,H=VH-PT-PB;
  const sx=i=>PL+(n>1?i/(n-1):0.5)*W;
  const sy=v=>PT+H-(v-minY)/(maxY-minY)*H;
  const grid=yTicks.map(t=>`<line x1="${PL}" y1="${sy(t).toFixed(1)}" x2="${VW-PR}" y2="${sy(t).toFixed(1)}" stroke="#eee" stroke-width="1"/>
    <text x="${PL-4}" y="${(sy(t)+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#aaa">${t}</text>`).join('');
  const step=Math.max(1,Math.ceil(n/7));
  const xlb=xLbs.map((lb,i)=>i%step===0||i===n-1?`<text x="${sx(i).toFixed(1)}" y="${VH-2}" text-anchor="middle" font-size="8" fill="#aaa">${lb}</text>`:'').join('');
  let paths='',dots='';
  seriesList.forEach(sr=>{
    let d='',inp=false;
    sr.data.forEach((v,i)=>{
      if(v===null||v===undefined||v===0){inp=false;return}
      const x=sx(i).toFixed(1),y=sy(v).toFixed(1);d+=inp?`L${x} ${y}`:`M${x} ${y}`;inp=true;
      dots+=`<circle cx="${x}" cy="${y}" r="2.5" fill="${sr.color}"/>`;
    });
    if(d)paths+=`<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>`;
  });
  const legend=seriesList.map((sr,i)=>`<tspan fill="${sr.color}">● ${sr.label}  </tspan>`).join('');
  return `<svg viewBox="0 0 ${VW} ${VH}" style="width:100%;height:auto">
    ${grid}${xlb}${paths}${dots}
    <text x="${PL}" y="12" font-size="9">${legend}</text></svg>`;
}
function barChart(series,xLbs,{colors,labels,maxY}){
  const n=series.length;if(!n)return '';
  const VW=340,VH=100,PL=8,PR=8,PT=8,PB=26;
  const W=VW-PL-PR,H=VH-PT-PB;
  const bw=Math.max(2,(W/n)-2);
  const cx=i=>PL+(i+0.5)*(W/n);
  const step=Math.max(1,Math.ceil(n/7));
  const xlb=xLbs.map((lb,i)=>i%step===0||i===n-1?`<text x="${cx(i).toFixed(1)}" y="${VH-2}" text-anchor="middle" font-size="8" fill="#aaa">${lb}</text>`:'').join('');
  const bars=series.map((s,i)=>{
    if(!s.y)return '';
    const bh=(s.y/maxY)*H;const c=colors[s.y]||'#aaa';
    return `<rect x="${(cx(i)-bw/2).toFixed(1)}" y="${(PT+H-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${c}" opacity=".85"/>`;
  }).join('');
  const legend=Object.entries(labels).map(([v,lb])=>`<tspan fill="${colors[v]||'#aaa'}">■${lb} </tspan>`).join('');
  return `<svg viewBox="0 0 ${VW} ${VH}" style="width:100%;height:auto">
    ${xlb}${bars}<text x="${PL}" y="${PT+6}" font-size="8">${legend}</text></svg>`;
}
function analyzePeriod(tagId){
  const pDates=data.dailyLogs.filter(l=>l.tags&&l.tags.includes(tagId)).map(l=>l.date).sort();
  if(!pDates.length)return null;
  const periods=[];let cur=[pDates[0]];
  for(let i=1;i<pDates.length;i++){
    const diff=(new Date(pDates[i]+'T00:00:00')-new Date(pDates[i-1]+'T00:00:00'))/86400000;
    if(diff<=2)cur.push(pDates[i]);else{periods.push(cur);cur=[pDates[i]]}
  }
  periods.push(cur);
  const starts=periods.map(p=>p[0]);
  if(starts.length<2)return{starts,avgCycle:null,next:null};
  const gaps=[];
  for(let i=1;i<starts.length;i++)gaps.push((new Date(starts[i]+'T00:00:00')-new Date(starts[i-1]+'T00:00:00'))/86400000);
  const avg=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);
  const last=new Date(starts[starts.length-1]+'T00:00:00');
  last.setDate(last.getDate()+avg);
  return{starts,avgCycle:avg,next:localDate(last)};
}
function renderPeriodInfo(info){
  const now=today();
  const rows=info.starts.slice(-4).map(s=>`<div class="tr"><span class="tr-l">经期开始</span><span class="tr-v">${s}</span></div>`).join('');
  const nextColor=info.next&&info.next<=now?'var(--r)':info.next?'var(--b)':'var(--txm)';
  return rows+
    (info.avgCycle?`<div class="tr"><span class="tr-l">平均周期</span><span class="tr-v">${info.avgCycle} 天</span></div>`:'')+
    (info.next?`<div class="tr"><span class="tr-l">预测下次</span><span class="tr-v" style="color:${nextColor}">${info.next}${info.next<=now?' (已到)':''}</span></div>`:'');
}
function renderTagStats(tagCounts,maxCount){
  return Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).map(([tid,cnt])=>{

    </div>`;

}
function renderSummary(){

      <div class="card-title"><span class="dot" style="background:#9c27b0"></span>睡眠质量（近 14 天）</div>
      <div class="chart-wrap">${barChart(sleepQ,xLb14,{colors:{1:'#d93025',2:'#e67e22',3:'#2d7d55'},labels:{1:'很差',2:'一般',3:'不错'},maxY:3})}</div>

      <div class="card-title"><span class="dot" style="background:var(--o)"></span>精力（近 14 天）</div>

    </div>
    ${wtLogs.length>=2?`<div class="card sum-section">
      <div class="card-title"><span class="dot" style="background:#9c27b0"></span>体重趋势</div>
      <div class="chart-wrap">${lineChart(wtLogs.map(l=>({y:l.weight})),wtLogs.map(l=>l.date.slice(5).replace('-','/')),
        {minY:Math.floor(Math.min(...wtLogs.map(l=>l.weight))-1),maxY:Math.ceil(Math.max(...wtLogs.map(l=>l.weight))+1),

      <div class="smi-detail">${esc(s.dose)} ${esc(s.unit)} · ${esc(s.category)}${s.note?' · '+esc(s.note):''}</div></div>
    <div class="smi-act">
      <button class="btn btn-sm btn-s" onclick="openEditSupp(${s.id})">编辑</button>
      <button class="btn btn-sm btn-d" onclick="delSupp(${s.id})">✕</button>
    </div></div>`).join('');
  return addBtn+'<div class="card">'+rows+'</div>';
}
function suppForm(s){
  s=s||{};
  const cats=['处方药','维生素','矿物质','中药','其他'];
  return `<div class="field"><label>名称</label><input type="text" id="sf-n" value="${esc(s.name||'')}" placeholder="左甲状腺素"/></div>
    <div class="field"><label>剂量</label><input type="text" id="sf-d" value="${esc(s.dose||'')}" placeholder="50mcg"/></div>
    <div class="field"><label>单位</label><input type="text" id="sf-u" value="${esc(s.unit||'')}" placeholder="片"/></div>
    <div class="field"><label>分类</label><select id="sf-c">${cats.map(c=>`<option ${c===s.category?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label>备注（可选）</label><input type="text" id="sf-note" value="${esc(s.note||'')}" placeholder="早起空腹服用"/></div>`;
}
function openAddSupp(){openSheet('添加补剂',suppForm()+'<button class="btn btn-p" onclick="submitSupp()">保存</button>')}
function openEditSupp(id){const s=data.supplements.find(x=>x.id===id);if(!s)return;openSheet('编辑补剂',suppForm(s)+`<button class="btn btn-p" onclick="submitSuppE(${id})">保存修改</button>`)}
function submitSupp(){
  const name=document.getElementById('sf-n').value.trim();if(!name){toast('请填写名称');return}
  const ids=data.supplements.map(s=>s.id);
  data.supplements.push({id:ids.length?Math.max(...ids)+1:1,name,dose:document.getElementById('sf-d').value.trim(),
    unit:document.getElementById('sf-u').value.trim(),category:document.getElementById('sf-c').value,note:document.getElementById('sf-note').value.trim()});
  closeSheet();persist();
}
function submitSuppE(id){
  const s=data.supplements.find(x=>x.id===id);if(!s)return;
  const name=document.getElementById('sf-n').value.trim();if(!name){toast('请填写名称');return}
  s.name=name;s.dose=document.getElementById('sf-d').value.trim();s.unit=document.getElementById('sf-u').value.trim();
  s.category=document.getElementById('sf-c').value;s.note=document.getElementById('sf-note').value.trim();
  closeSheet();persist();
}
function delSupp(id){
  if(!confirm('删除后历史记录也会失效，确认？'))return;
  data.supplements=data.supplements.filter(s=>s.id!==id);
  persist();
}
// ── settings ──
function maskTok(t){return t?t.slice(0,7)+'····'+t.slice(-4):'—'}
function settingsSectionHtml(){
  return `
  <div class="card">
    <div class="card-title"><span class="dot" style="background:var(--pri)"></span>☁️ 云同步</div>
    <div class="tr"><span class="tr-l">Gist</span><span class="tr-v" style="font-size:11.5px;word-break:break-all">${esc(CREDS.gistId)}</span></div>
    <div class="tr"><span class="tr-l">数据文件</span><span class="tr-v">${HUB_FILE}</span></div>
    <div class="tr"><span class="tr-l">Token</span><span class="tr-v">${esc(maskTok(CREDS.token))}</span></div>
    ${lastSavedAt?`<div class="tr"><span class="tr-l">最近保存</span><span class="tr-v">${lastSavedAt.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</span></div>`:''}
    <button class="btn btn-s" style="width:100%;margin-top:10px" onclick="closeSheet();reloadFromCloud()">🔄 立即从云端重新加载</button>
  </div>
  <div class="card">
    <div class="card-title"><span class="dot" style="background:var(--o)"></span>🔑 凭据</div>
    <p class="hint" style="margin-bottom:10px">凭据以 PIN 加密内置在页面里，本机解锁一次即可。若更换了 token（regenerate），可在下方手动覆盖，或让 Claude 重新生成加密页面。</p>
    <div class="field"><label>Gist ID</label><input type="text" id="cg-gid" value="${esc(CREDS.gistId)}" spellcheck="false"/></div>
    <div class="field"><label>PAT Token</label><input type="password" id="cg-tok" placeholder="留空则不修改" spellcheck="false"/></div>
    <button class="btn btn-s" style="width:100%;margin-bottom:8px" onclick="applyCreds()">更新本机凭据</button>
    <button class="btn btn-d" style="width:100%" onclick="lockDevice()">🔒 锁定此设备（清除本机凭据）</button>
  </div>
  <div class="card">
    <div class="card-title"><span class="dot" style="background:var(--txm)"></span>ℹ️ 说明</div>
    <p class="hint">· 所有数据存在私有 Gist 的 <b>${HUB_FILE}</b>，跨设备同步。<br>
    · 旧数据备份仍保留：同一 gist 里的 kanban-data.json 和旧 health gist 的 health-data.json（迁移后不再更新）。<br>
    · 浏览器 localStorage 只存解锁后的凭据 + 离线缓存；清缓存后重输 PIN 即可。</p>
  </div>`;
}
function applyCreds(){
  const g=document.getElementById('cg-gid').value.trim();
  const t=document.getElementById('cg-tok').value.trim();
  if(!g){toast('Gist ID 不能为空');return}
  CREDS=Object.assign({},CREDS,{gistId:g},t?{token:t}:{});
  LS.set(CRED_KEY,CREDS);
  closeSheet();
  toast('✅ 本机凭据已更新，正在重新同步…');
  reloadFromCloud();
}

// ══ render all / boot ══
function renderAll(){
  if(!data)return;
  renderToday();renderBoardTab();renderLogsTab();renderSummary();
}
async function startApp(){
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  try{
    const savedTab=LS.get(TAB_KEY);
    if(savedTab&&['today','board','logs','sum'].includes(savedTab))switchTab(savedTab);
  }catch(e){}
  if(loadCache()){ensureShape();renderAll()}
  await reloadFromCloud();
}
window.addEventListener('beforeunload',()=>{if(saveTimer&&CREDS)flushSave()});
window.addEventListener('focus',()=>{
  if(!CREDS||!data)return;
  const st=document.getElementById('sync-dot').dataset.state;
  if(st!=='ok'&&st!==undefined)return;
  if(Date.now()-lastFocusReload<30000)return;
  lastFocusReload=Date.now();
  reloadFromCloud();
});
document.getElementById('pin-inp').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock()});
// boot
(function(){
  CREDS=loadCreds();
  if(CREDS){startApp()}
  else{setTimeout(()=>document.getElementById('pin-inp').focus(),100)}
})();
</script>
</body>
</html>
